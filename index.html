
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products Store | API Calling</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Products Store</a>
            <span class="text-white">API Calling Project</span>
        </div>
    </nav>

    <header class="text-center py-5">
        <h1>Our Products</h1>
        <p class="text-secondary">Explore products from our online store</p>
    </header>

    <main class="container pb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>All Products</h3>

            <button class="btn btn-outline-dark" onclick="getData()">
                Refresh Products
            </button>
        </div>

        <div id="loader" class="text-center mb-3">
            Loading products...
        </div>

        <p id="message" class="text-center"></p>

        <div id="main" class="row g-4">
            <!-- Products will appear here -->
        </div>

    </main>

    

    <script src="app.js"></script>

</body>
</html>
